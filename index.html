
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ColorGen</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f4f4;
            padding: 40px 20px;
            transition: background-color 0.4s;
        }

        h1 {
            font-size: 40px;
        }

        p {
            font-size: 18px;
        }

        #colorBox {
            width: 280px;
            height: 220px;
            max-width: 90%;
            margin: 30px auto;
            border-radius: 15px;
            background: #3498db;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
            box-shadow: 0 4px 12px #0002;
        }

        button {
            background: #222;
            color: white;
            padding: 15px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <h1>ColorGen</h1>
    <p>Discover a new color with every click!</p>

    <div id="colorBox">#3498DB</div>

    <button onclick="generateColor()">
        Generate Your Random Color
    </button>

    <p id="message">Click the button to get started!</p>

    <script>
        function generateColor() {
            const letters = "0123456789ABCDEF";
            let color = "#";

            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }

            document.getElementById("colorBox").style.backgroundColor = color;
            document.getElementById("colorBox").textContent = color;
            document.body.style.backgroundColor = color;
            document.getElementById("message").textContent =
                "Your new color is " + color + "!";
        }
    </script>

</body>
</html>
